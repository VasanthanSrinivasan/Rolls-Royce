<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Rolls-Royce</title>
  <link href="style.css" rel="stylesheet">
</head>
<style>  
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family:Georgia, 'Times New Roman', Times, serif;
}

body {
  background-image: url('https://images.pexels.com/photos/3764984/pexels-photo-3764984.jpeg');  /* Local path */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  position: relative;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(0px);
}

.card {
  background-color: rgba(255, 255, 255, 0.9);
  padding: 30px 40px;
  border-radius: 12px;
  box-shadow: 0 8px 30px rgba(245, 244, 244, 0.2);
  max-width: 400px;
  width: 100%;
  text-align: center;
}

h2 {
  color:#333;
  margin-bottom: 20px;
  align-items: center;
}

label {
  color: black;
  font-size: 14px;
  margin: 8px 0 4px;
  display: block;
}


input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: 1px solid #ddd;
  border-radius: 6px;
}

input:focus {
  background: rgba(255,255,255,0.2);
  box-shadow: 0 0 10px rgba(255,165,0,0.6);
}

button {
  background-color: orange;
  color: white;
  padding: 12px;
  width: 100%;
  border: none;
  margin-top: 15px;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}
  button:hover {
  background-color: darkorange;
}

.register-link {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color:black;
}
.register-link a {
      color: orange;
      text-decoration: none;
      font-weight: 500;
}

.register-link a:hover {
  text-decoration: underline;
}


a:hover {
  color: orange;
}

a {
  display: inline-block;
  margin-top: 15px;
  color: #333;
  text-decoration: underline;
}
.login-container {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
}
</style>
<body class="login-body">
  <div class="login-container">
    <div class="login-box">
    <div class="card">
    <h2>Login Form</h2>

      <form>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />

        <button type="submit">Login</button>
        <p class="register-link">Don't have an account? <a href="register.html">Register here</a></p>
      </form>
    </div>
  </div>
</body>
</html>
