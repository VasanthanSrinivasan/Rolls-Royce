<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Rolls Royce</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Banner */
    .contact-banner {
      background: url('https://images.pexels.com/photos/5046305/pexels-photo-5046305.jpeg') no-repeat center center/cover;
      height: 50vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      position: relative;
    }
    .contact-banner::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
    }
    .contact-banner h1 {
      font-size: 3rem;
      z-index: 1;
      animation: fadeDown 1s ease-out;
    }

    /* Form Section */
    .contact-section {
      background: #0d0d0d;
      padding: 60px 20px;
      display: flex;
      justify-content: center;
    }
    .contact-form {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      color: white;
      animation: fadeUp 1s ease-out;
    }
    .contact-form h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 1rem;
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: none;
      background: rgba(255,255,255,0.15);
    }
    .contact-form button {
      width: 100%;
      padding: 12px;
      border: none;
      background: linear-gradient(90deg, gold, goldenrod);
      color: black;
      font-weight: bold;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .contact-form button:hover {
      transform: scale(1.05);
    }

    /* Animations */
    @keyframes fadeUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeDown {
      from { transform: translateY(-40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Banner -->
  <div class="contact-banner">
    <h1>Contact Rolls-Royce Luxury</h1>
  </div>

  <!-- Contact Form -->
  <section class="contact-section">
    <form class="contact-form">
      <h2>Get in Touch</h2>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Email Address" required>
      <input type="tel" placeholder="Phone Number">
      <textarea rows="5" placeholder="Your Message"></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

</body>
</html>
