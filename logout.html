<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logout - Rolls-Royce</title>
  <link href="style.css" rel="stylesheet">
  <style>
    /* Global Styling */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://images.pexels.com/photos/5046370/pexels-photo-5046370.jpeg') no-repeat center center/cover;
      position: relative;
      overflow: hidden;
    }

    /* Overlay Blur Effect */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      z-index: 0;
    }

    /* Logout Container */
    .logout-container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: fadeInUp 0.s ease-out;
    }

    /* Heading */
    .logout-container h2 {
      color: #fff;
      font-size: 1.8rem;
      margin-bottom: 20px;
      animation: textGlow 2s ease-in-out infinite alternate;
    }

    /* Button */
    .logout-button {
      display: inline-block;
      background: linear-gradient(45deg,#ff5e00, #ff9900);
      color: white;
      padding: 12px 25px;
      border-radius: 30px;
      font-size: 1rem;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 165, 0, 0.4);
    }

    .logout-button:hover {
      background: linear-gradient(45deg, blue,aqua);
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 165, 0, 0.6);
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes textGlow {
      0% { text-shadow: 0 0 5px orange, 0 0 10px gold; }
      100% { text-shadow: 0 0 15px red, 0 0 30px orangered; }
    }
  </style>
</head>
<body>
  <div class="logout-container">
    <h2>You have been logged out.</h2>
    <a href="index.html" class="logout-button">Return to Home</a>
  </div>
</body>
</html>
